  <title id="p13-t">P13 · Contract net (bidding)</title>
  <desc id="p13-d">manager-1 asks the three couriers for bids in one call; from the gather it awards the parcel to the lowest bidder with a second call; the winner answers with its code; the manager reports the award.</desc>
