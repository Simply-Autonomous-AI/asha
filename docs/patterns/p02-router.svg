<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-labelledby="p02-t p02-d">
  <title id="p02-t">Router: router-1 sends each request to the one desk whose description covers it</title>
  <desc id="p02-d">You write to router-1. It calls list_agents, which returns each desk with its description; only the descriptions say what each desk does. It sends the request, as an instruction, to the one desk that covers it — here desk-a-1 for a translation — and never replies. That desk replies to you; the other desks receive nothing.</desc>
  <style>
  /* For a viewer showing this diagram on its own: docs/assets/docs.css, by tools/docs/svg-standalone.mts. */
  svg:root { background: #ffffff; font-family: "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  svg:root .box { fill: #ffffff; stroke: #17211d; stroke-width: 1.2; }
  svg:root .box.accent { fill: #e0efec; stroke: #0e6b66; }
  svg:root .box.host { fill: #f1f4f2; stroke: #52605a; stroke-dasharray: 4 3; }
  svg:root .box.planned { fill: #ece8f8; stroke: #5b44b0; stroke-dasharray: 4 3; }
  svg:root .label { fill: #17211d; font-size: 13px; }
  svg:root .label.small { font-size: 11px; fill: #52605a; }
  svg:root .label.mono { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
  svg:root .label.title { font-weight: 600; }
  svg:root .edge { stroke: #0e6b66; stroke-width: 1.5; fill: none; }
  svg:root .edge.dim { stroke: #52605a; stroke-dasharray: 4 3; }
  </style>
  <defs><marker id="p02-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0e6b66"/></marker></defs>
  <rect class="box" x="28" y="10" width="128" height="34" rx="5"/>
  <text class="label mono" x="92" y="32" text-anchor="middle">you</text>
  <path class="edge dim" d="M92 44 V264"/>
  <rect class="box accent" x="172" y="10" width="128" height="34" rx="5"/>
  <text class="label mono" x="236" y="32" text-anchor="middle">router-1</text>
  <path class="edge dim" d="M236 44 V264"/>
  <rect class="box accent" x="316" y="10" width="128" height="34" rx="5"/>
  <text class="label mono" x="380" y="32" text-anchor="middle">desk-a-1</text>
  <path class="edge dim" d="M380 44 V264"/>
  <rect class="box accent" x="460" y="10" width="128" height="34" rx="5"/>
  <text class="label mono" x="524" y="32" text-anchor="middle">desk-b-1</text>
  <path class="edge dim" d="M524 44 V264"/>
  <rect class="box accent" x="604" y="10" width="128" height="34" rx="5"/>
  <text class="label mono" x="668" y="32" text-anchor="middle">desk-c-1</text>
  <path class="edge dim" d="M668 44 V264"/>
  <path class="edge" d="M92 80 H234" marker-end="url(#p02-a)"/>
  <text class="label small" x="164" y="74" text-anchor="middle">Please translate &#x27;thank you&#x27; into French.</text>
  <text class="label small" x="244" y="114">list_agents → descriptions</text>
  <path class="edge" d="M236 148 H378" marker-end="url(#p02-a)"/>
  <text class="label small" x="308" y="142" text-anchor="middle">internal: Translate &#x27;thank you&#x27; into French.</text>
  <path class="edge" d="M380 192 H94" marker-end="url(#p02-a)"/>
  <text class="label small" x="236" y="186" text-anchor="middle">output: Merci</text>
  <text class="label small" x="532" y="226">desk-b-1 and desk-c-1: nothing</text>
</svg>
