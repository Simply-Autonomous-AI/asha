  <path class="edge" d="M250 252 L298 246" marker-end="url(#p11-a)"/>
  <path class="edge" d="M250 256 L298 282" marker-end="url(#p11-a)"/>
  <path class="edge" d="M250 260 L298 316" marker-end="url(#p11-a)"/>
  <text class="label small" x="218" y="350">one call at a time, in turn</text>
  <rect class="box accent" x="460" y="232" width="200" height="100" rx="5"/>
