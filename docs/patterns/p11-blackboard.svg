  <text class="label mono small" x="490" y="80">item: saffron</text>
  <text class="label mono small" x="490" y="98">item: quince jam</text>
  <text class="label mono small" x="490" y="116">item: rye flour</text>
  <path class="edge" d="M420 84 H478" marker-end="url(#p11-a)"/>
  <text class="label small" x="425" y="78">post</text>
