  <text class="label small" x="330" y="182">editor-1 reads the board, then replies with the items</text>
  <text class="label" x="20" y="222">p11-b · the meeting notice</text>
  <rect class="box" x="20" y="238" width="80" height="34" rx="5"/>
  <text class="label mono" x="60" y="260" text-anchor="middle">you</text>
