  <path class="edge" d="M458 312 H422" marker-end="url(#p11-a)"/>
  <path class="edge" d="M422 324 H458" marker-end="url(#p11-a)"/>
  <text class="label small" x="425" y="350">read, then post the notice extended</text>
  <path class="edge" d="M560 332 C560 395 195 395 195 274" marker-end="url(#p11-a)"/>
  <text class="label small" x="300" y="408">planner-1 reads the board, then replies with the notice</text>
</svg>
