  <text class="label small" x="475" y="108" text-anchor="middle">Round 1. Motion: …</text>
  <path class="edge" d="M665 148 H287" marker-end="url(#p09-a)"/>
  <text class="label small" x="475" y="142" text-anchor="middle">≤ 200 characters each, STANCE: FOR / AGAINST</text>
  <path class="edge" d="M475 182 H287" marker-end="url(#p09-a)"/>
  <text class="label small" x="380" y="176" text-anchor="middle">gather: 2 answered</text>
  <path class="edge" d="M285 216 H663" marker-end="url(#p09-a)"/>
