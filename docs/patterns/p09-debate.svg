  <text class="label mono" x="665" y="32" text-anchor="middle">optimist-1, sceptic-1</text>
  <path class="edge dim" d="M665 44 V356"/>
  <path class="edge" d="M95 80 H283" marker-end="url(#p09-a)"/>
  <text class="label small" x="190" y="74" text-anchor="middle">Judge the motion: …</text>
