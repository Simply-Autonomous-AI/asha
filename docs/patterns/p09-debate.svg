<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 362" role="img" aria-labelledby="p09-t p09-d">
  <title id="p09-t">P9 · Debate with a judge</title>
  <desc id="p09-d">judge-1 consults both debaters for round 1, then again for round 2 with both round-1 answers quoted, then replies with a verdict naming both.</desc>
