  <rect class="box" x="20" y="10" width="150" height="34" rx="5"/>
  <text class="label mono" x="95" y="32" text-anchor="middle">you</text>
  <path class="edge dim" d="M95 44 V356"/>
  <rect class="box accent" x="210" y="10" width="150" height="34" rx="5"/>
  <text class="label mono" x="285" y="32" text-anchor="middle">judge-1</text>
  <path class="edge dim" d="M285 44 V356"/>
  <rect class="box" x="400" y="10" width="150" height="34" rx="5"/>
