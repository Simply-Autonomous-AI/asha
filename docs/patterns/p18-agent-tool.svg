<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 294" role="img" aria-labelledby="p18-t p18-d">
  <title id="p18-t">P18 · Agent as tool (call and return)</title>
  <desc id="p18-d">The delegator consults worker-1 with one call; worker-1's answer goes back to the delegator only, in one gather from the harness; the delegator replies to you.</desc>
  <defs><marker id="p18-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0e6b66"/></marker></defs>
  <rect class="box" x="20" y="10" width="150" height="34" rx="5"/>
  <text class="label mono" x="95" y="32" text-anchor="middle">you</text>
  <path class="edge dim" d="M95 44 V288"/>
  <rect class="box accent" x="210" y="10" width="150" height="34" rx="5"/>
  <text class="label mono" x="285" y="32" text-anchor="middle">delegator-1</text>
  <path class="edge dim" d="M285 44 V288"/>
  <rect class="box" x="400" y="10" width="150" height="34" rx="5"/>
  <text class="label mono" x="475" y="32" text-anchor="middle">asha</text>
  <path class="edge dim" d="M475 44 V288"/>
  <rect class="box accent" x="590" y="10" width="150" height="34" rx="5"/>
  <text class="label mono" x="665" y="32" text-anchor="middle">worker-1</text>
  <path class="edge dim" d="M665 44 V288"/>
  <path class="edge" d="M95 80 H283" marker-end="url(#p18-a)"/>
  <text class="label small" x="190" y="74" text-anchor="middle">Get worker-1 to say Hello World, then tell me…</text>
  <text class="label small" x="293" y="114">consult (guidance step 1)</text>
  <path class="edge" d="M285 148 H663" marker-end="url(#p18-a)"/>
  <text class="label small" x="475" y="142" text-anchor="middle">call question: the same words</text>
  <path class="edge" d="M665 182 H287" marker-end="url(#p18-a)"/>
  <text class="label small" x="475" y="176" text-anchor="middle">answer: Hello World (to the caller only)</text>
  <path class="edge" d="M475 216 H287" marker-end="url(#p18-a)"/>
  <text class="label small" x="380" y="210" text-anchor="middle">gather: 1 answered</text>
  <path class="edge" d="M285 250 H97" marker-end="url(#p18-a)"/>
  <text class="label small" x="190" y="244" text-anchor="middle">output: worker-1 said: Hello World</text>
</svg>
