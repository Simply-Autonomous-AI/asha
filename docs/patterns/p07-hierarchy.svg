<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="p07-t p07-d">
  <title id="p07-t">P7 · Hierarchical teams</title>
  <desc id="p07-d">top-1 consults lead-warm-1 and lead-cool-1; each lead, asked in a call, consults its two workers; the workers answer their numbers; each lead's gather is a call turn in which it answers top-1 with its two numbers; top-1's gather holds both, and it replies warm: 4, 7; cool: 3, 2.</desc>
  <style>
  /* For a viewer showing this diagram on its own: docs/assets/docs.css, by tools/docs/svg-standalone.mts. */
  svg:root { background: #ffffff; font-family: "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  svg:root .box { fill: #ffffff; stroke: #17211d; stroke-width: 1.2; }
  svg:root .box.accent { fill: #e0efec; stroke: #0e6b66; }
  svg:root .box.host { fill: #f1f4f2; stroke: #52605a; stroke-dasharray: 4 3; }
  svg:root .box.planned { fill: #ece8f8; stroke: #5b44b0; stroke-dasharray: 4 3; }
  svg:root .label { fill: #17211d; font-size: 13px; }
  svg:root .label.small { font-size: 11px; fill: #52605a; }
  svg:root .label.mono { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
  svg:root .label.title { font-weight: 600; }
  svg:root .edge { stroke: #0e6b66; stroke-width: 1.5; fill: none; }
  svg:root .edge.dim { stroke: #52605a; stroke-dasharray: 4 3; }
  </style>
  <defs><marker id="p07-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0e6b66"/></marker></defs>
  <rect class="box" x="255" y="10" width="130" height="34" rx="5"/>
  <text class="label mono" x="320" y="32" text-anchor="middle">you</text>
  <rect class="box accent" x="255" y="70" width="130" height="34" rx="5"/>
  <text class="label mono" x="320" y="92" text-anchor="middle">top-1</text>
  <rect class="box accent" x="95" y="140" width="150" height="34" rx="5"/>
  <text class="label mono" x="170" y="162" text-anchor="middle">lead-warm-1</text>
  <rect class="box accent" x="395" y="140" width="150" height="34" rx="5"/>
  <text class="label mono" x="470" y="162" text-anchor="middle">lead-cool-1</text>
  <rect class="box" x="20" y="230" width="110" height="34" rx="5"/>
  <text class="label mono" x="75" y="252" text-anchor="middle">red-1: 4</text>
  <rect class="box" x="160" y="230" width="120" height="34" rx="5"/>
  <text class="label mono" x="220" y="252" text-anchor="middle">orange-1: 7</text>
  <rect class="box" x="360" y="230" width="110" height="34" rx="5"/>
  <text class="label mono" x="415" y="252" text-anchor="middle">blue-1: 3</text>
  <rect class="box" x="500" y="230" width="120" height="34" rx="5"/>
  <text class="label mono" x="560" y="252" text-anchor="middle">violet-1: 2</text>
  <path class="edge" d="M320 44 V68" marker-end="url(#p07-a)"/>
  <path class="edge" d="M300 104 L190 138" marker-end="url(#p07-a)"/>
  <path class="edge" d="M340 104 L450 138" marker-end="url(#p07-a)"/>
  <text class="label small" x="320" y="128" text-anchor="middle">consult (call)</text>
