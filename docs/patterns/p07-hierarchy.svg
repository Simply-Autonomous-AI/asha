  <text class="label small" x="320" y="205" text-anchor="middle">each lead's consult: a child of top-1's call</text>
  <text class="label small" x="320" y="290" text-anchor="middle">answers come back up: 4, 7 · 3, 2 → warm: 4, 7; cool: 3, 2</text>
