<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 362" role="img" aria-labelledby="p23-t p23-d">
  <title id="p23-t">P23 · Iterative consensus debate</title>
  <desc id="p23-d">moderator-1 consults the three debaters each round; round 1 disagrees, so round 2 quotes every answer; when every answer agrees the moderator states the consensus and the round.</desc>
  <style>
  /* For a viewer showing this diagram on its own: docs/assets/docs.css, by tools/docs/svg-standalone.mts. */
  svg:root { background: #ffffff; font-family: "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  svg:root .box { fill: #ffffff; stroke: #17211d; stroke-width: 1.2; }
  svg:root .box.accent { fill: #e0efec; stroke: #0e6b66; }
  svg:root .box.host { fill: #f1f4f2; stroke: #52605a; stroke-dasharray: 4 3; }
  svg:root .box.planned { fill: #ece8f8; stroke: #5b44b0; stroke-dasharray: 4 3; }
  svg:root .label { fill: #17211d; font-size: 13px; }
  svg:root .label.small { font-size: 11px; fill: #52605a; }
  svg:root .label.mono { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
  svg:root .label.title { font-weight: 600; }
  svg:root .edge { stroke: #0e6b66; stroke-width: 1.5; fill: none; }
  svg:root .edge.dim { stroke: #52605a; stroke-dasharray: 4 3; }
  </style>
  <defs><marker id="p23-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0e6b66"/></marker></defs>
  <rect class="box" x="20" y="10" width="150" height="34" rx="5"/>
  <text class="label mono" x="95" y="32" text-anchor="middle">you</text>
  <path class="edge dim" d="M95 44 V356"/>
  <rect class="box accent" x="210" y="10" width="150" height="34" rx="5"/>
  <text class="label mono" x="285" y="32" text-anchor="middle">moderator-1</text>
  <path class="edge dim" d="M285 44 V356"/>
  <rect class="box" x="400" y="10" width="150" height="34" rx="5"/>
  <text class="label mono" x="475" y="32" text-anchor="middle">asha</text>
  <path class="edge dim" d="M475 44 V356"/>
  <rect class="box accent" x="590" y="10" width="150" height="34" rx="5"/>
  <text class="label mono" x="665" y="32" text-anchor="middle">debater-a-1, -b-1, -c-1</text>
  <path class="edge dim" d="M665 44 V356"/>
  <path class="edge" d="M95 80 H283" marker-end="url(#p23-a)"/>
  <text class="label small" x="190" y="74" text-anchor="middle">Get the debaters to agree: … 6, 7, 8.</text>
  <path class="edge" d="M285 114 H663" marker-end="url(#p23-a)"/>
  <text class="label small" x="475" y="108" text-anchor="middle">Round 1. …</text>
  <path class="edge" d="M665 148 H287" marker-end="url(#p23-a)"/>
  <text class="label small" x="475" y="142" text-anchor="middle">ANSWER: 7 · 7 · 6</text>
  <path class="edge" d="M475 182 H287" marker-end="url(#p23-a)"/>
  <text class="label small" x="380" y="176" text-anchor="middle">gather: 3 answered (they differ)</text>
  <path class="edge" d="M285 216 H663" marker-end="url(#p23-a)"/>
  <text class="label small" x="475" y="210" text-anchor="middle">Round 2. … Previous answers: …</text>
  <path class="edge" d="M665 250 H287" marker-end="url(#p23-a)"/>
  <text class="label small" x="475" y="244" text-anchor="middle">ANSWER: 7 · 7 · 7</text>
  <path class="edge" d="M475 284 H287" marker-end="url(#p23-a)"/>
  <text class="label small" x="380" y="278" text-anchor="middle">gather: 3 answered (all equal)</text>
  <path class="edge" d="M285 318 H97" marker-end="url(#p23-a)"/>
  <text class="label small" x="190" y="312" text-anchor="middle">output: Consensus: 7, reached in round 2.</text>
</svg>
