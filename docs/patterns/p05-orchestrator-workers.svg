<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 294" role="img" aria-labelledby="p05-t p05-d">
  <title id="p05-t">P5 · Orchestrator–workers</title>
  <desc id="p05-d">lead-1 reads the workers' descriptions, consults each with only its part in one call, gets the three answers in one gather, and replies with three lines.</desc>
  <defs><marker id="p05-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0e6b66"/></marker></defs>
  <rect class="box" x="20" y="10" width="150" height="34" rx="5"/>
  <text class="label mono" x="95" y="32" text-anchor="middle">you</text>
  <path class="edge dim" d="M95 44 V288"/>
  <rect class="box accent" x="210" y="10" width="150" height="34" rx="5"/>
  <text class="label mono" x="285" y="32" text-anchor="middle">lead-1</text>
  <path class="edge dim" d="M285 44 V288"/>
  <rect class="box" x="400" y="10" width="150" height="34" rx="5"/>
  <text class="label mono" x="475" y="32" text-anchor="middle">asha</text>
  <path class="edge dim" d="M475 44 V288"/>
  <rect class="box accent" x="590" y="10" width="150" height="34" rx="5"/>
  <text class="label mono" x="665" y="32" text-anchor="middle">worker-a-1, -b-1, -c-1</text>
  <path class="edge dim" d="M665 44 V288"/>
  <path class="edge" d="M95 80 H283" marker-end="url(#p05-a)"/>
  <text class="label small" x="190" y="74" text-anchor="middle">translate …, add 17 and 25, say Hello World</text>
  <text class="label small" x="293" y="114">list_agents, then consult (steps 1, 2)</text>
  <path class="edge" d="M285 148 H663" marker-end="url(#p05-a)"/>
  <text class="label small" x="475" y="142" text-anchor="middle">one part to each, in one call</text>
  <path class="edge" d="M665 182 H287" marker-end="url(#p05-a)"/>
  <text class="label small" x="475" y="176" text-anchor="middle">Merci · 42 · Hello World</text>
  <path class="edge" d="M475 216 H287" marker-end="url(#p05-a)"/>
  <text class="label small" x="380" y="210" text-anchor="middle">gather: 3 answered</text>
  <path class="edge" d="M285 250 H97" marker-end="url(#p05-a)"/>
  <text class="label small" x="190" y="244" text-anchor="middle">output: three lines, in the order asked</text>
</svg>
