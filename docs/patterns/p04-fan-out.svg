<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 294" role="img" aria-labelledby="p04-t p04-d">
  <title id="p04-t">P4 · Fan-out / fan-in (scatter-gather)</title>
  <desc id="p04-d">supervisor-1 consults the nine fact members in one call; their nine answers go back to it only, as one gather; it replies with the rainbow's numbers.</desc>
