  <path class="edge" d="M95 80 H283" marker-end="url(#p04-a)"/>
  <text class="label small" x="190" y="74" text-anchor="middle">Which sequence of the numbers …?</text>
  <text class="label small" x="293" y="114">consult, one call to all nine (step 1)</text>
  <path class="edge" d="M285 148 H663" marker-end="url(#p04-a)"/>
  <text class="label small" x="475" y="142" text-anchor="middle">nine questions, posted before any answer</text>
