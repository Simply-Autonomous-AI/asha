<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-labelledby="dp-eph-t dp-eph-d">
  <title id="dp-eph-t">Ephemeral daemon lifecycle</title>
  <desc id="dp-eph-d">The daemon is started either in the foreground by ./asha --server, or in the background by a CLI command that found no daemon answering, which spawns a detached ./asha --server logging to logs/server.log. At start the daemon takes daemon.lock, listens on 127.0.0.1 on port 0, and writes daemon.json with its pid and port. The CLI finds it through daemon.json and GET /v1/health. ./asha --stop sends SIGTERM; the daemon removes daemon.json, closes its listener, stops every agent and model server, and releases the lock.</desc>
  <style>
  /* For a viewer showing this diagram on its own: docs/assets/docs.css, by tools/docs/svg-standalone.mts. */
  svg:root { background: #ffffff; font-family: "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  svg:root .box { fill: #ffffff; stroke: #17211d; stroke-width: 1.2; }
  svg:root .box.accent { fill: #e0efec; stroke: #0e6b66; }
  svg:root .box.host { fill: #f1f4f2; stroke: #52605a; stroke-dasharray: 4 3; }
  svg:root .box.planned { fill: #ece8f8; stroke: #5b44b0; stroke-dasharray: 4 3; }
  svg:root .label { fill: #17211d; font-size: 13px; }
  svg:root .label.small { font-size: 11px; fill: #52605a; }
  svg:root .label.mono { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
  svg:root .label.title { font-weight: 600; }
  svg:root .edge { stroke: #0e6b66; stroke-width: 1.5; fill: none; }
  svg:root .edge.dim { stroke: #52605a; stroke-dasharray: 4 3; }
  </style>
  <defs><marker id="dp-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0e6b66"/></marker></defs>

  <rect class="box" x="10" y="20" width="200" height="54" rx="6"/>
  <text class="label mono" x="110" y="44" text-anchor="middle">./asha --server</text>
  <text class="label small" x="110" y="62" text-anchor="middle">foreground, logs on stderr</text>

  <rect class="box" x="10" y="100" width="200" height="54" rx="6"/>
  <text class="label mono" x="110" y="124" text-anchor="middle">./asha message=…</text>
  <text class="label small" x="110" y="142" text-anchor="middle">no daemon answers → spawn</text>

  <rect class="box accent" x="280" y="20" width="220" height="134" rx="6"/>
  <text class="label title" x="390" y="44" text-anchor="middle">daemon</text>
  <text class="label small" x="390" y="68" text-anchor="middle">1 take daemon.lock (pid lock)</text>
  <text class="label small" x="390" y="88" text-anchor="middle">2 listen 127.0.0.1:0</text>
  <text class="label small" x="390" y="108" text-anchor="middle">3 write daemon.json {pid, port}</text>
  <text class="label small" x="390" y="128" text-anchor="middle">4 serve until SIGINT / SIGTERM</text>

  <rect class="box" x="570" y="20" width="180" height="134" rx="6"/>
  <text class="label title" x="660" y="44" text-anchor="middle">on SIGTERM</text>
  <text class="label small" x="660" y="68" text-anchor="middle">remove daemon.json</text>
  <text class="label small" x="660" y="88" text-anchor="middle">close the listener</text>
  <text class="label small" x="660" y="108" text-anchor="middle">stop agents, model servers</text>
  <text class="label small" x="660" y="128" text-anchor="middle">release the lock</text>

  <path class="edge" d="M210 47 H278" marker-end="url(#dp-arr)"/>
  <path class="edge" d="M210 127 H278" marker-end="url(#dp-arr)"/>
  <text class="label small" x="244" y="120" text-anchor="middle">detached</text>
  <path class="edge" d="M500 87 H568" marker-end="url(#dp-arr)"/>

  <rect class="box" x="10" y="180" width="200" height="44" rx="6"/>
  <text class="label mono" x="110" y="207" text-anchor="middle">./asha --stop</text>
  <path class="edge" d="M210 202 H660 V156" marker-end="url(#dp-arr)"/>
  <text class="label small" x="430" y="196" text-anchor="middle">SIGTERM, then wait up to 30 s</text>
</svg>
