<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="clideleg-t clideleg-d">
  <title id="clideleg-t">The two-agent hello world, message by message</title>
  <desc id="clideleg-d">Every message goes through channel duo in the daemon. user-1's ./asha posts an input addressed to hewo-1. The channel delivers it to hewo-1, which says ok and calls send_message to hewo-2 with Say Hello World, an internal message. The channel delivers that to hewo-2, which says ok and calls reply with Hello World. The channel sends that output to user-1, whose ./asha prints the text on stdout. When no agent is still working, ./asha closes the stream and exits 0.</desc>
  <defs><marker id="clideleg-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0e6b66"/></marker></defs>

  <rect class="box accent" x="20" y="14" width="150" height="40" rx="6"/>
  <text class="label title" x="95" y="39" text-anchor="middle">./asha (user-1)</text>
  <rect class="box" x="230" y="14" width="160" height="40" rx="6"/>
  <text class="label title" x="310" y="39" text-anchor="middle">channel duo</text>
  <rect class="box" x="420" y="14" width="120" height="40" rx="6"/>
  <text class="label title" x="480" y="39" text-anchor="middle">hewo-1</text>
  <rect class="box" x="630" y="14" width="120" height="40" rx="6"/>
  <text class="label title" x="690" y="39" text-anchor="middle">hewo-2</text>

  <path class="edge dim" d="M95 54 V316"/>
  <path class="edge dim" d="M310 54 V316"/>
  <path class="edge dim" d="M480 54 V316"/>
  <path class="edge dim" d="M690 54 V316"/>

  <path class="edge" d="M95 90 H306" marker-end="url(#clideleg-arr)"/>
  <text class="label mono" x="200" y="83" text-anchor="middle">input, to=hewo-1</text>
  <path class="edge" d="M310 118 H476" marker-end="url(#clideleg-arr)"/>
  <text class="label small" x="395" y="111" text-anchor="middle">deliver</text>

  <path class="edge" d="M480 154 H314" marker-end="url(#clideleg-arr)"/>
  <text class="label mono" x="395" y="147" text-anchor="middle">status: ok</text>
  <path class="edge" d="M480 186 H314" marker-end="url(#clideleg-arr)"/>
  <text class="label mono" x="395" y="179" text-anchor="middle">send_message(hewo-2, …)</text>
  <path class="edge" d="M310 214 H686" marker-end="url(#clideleg-arr)"/>
  <text class="label mono" x="585" y="207" text-anchor="middle">internal: Say Hello World</text>

  <path class="edge" d="M690 244 H314" marker-end="url(#clideleg-arr)"/>
  <text class="label mono" x="585" y="237" text-anchor="middle">status: ok</text>
  <path class="edge" d="M690 276 H314" marker-end="url(#clideleg-arr)"/>
  <text class="label mono" x="585" y="269" text-anchor="middle">reply("Hello World")</text>
  <path class="edge" d="M310 304 H99" marker-end="url(#clideleg-arr)"/>
  <text class="label mono" x="200" y="297" text-anchor="middle">output → stdout</text>

  <text class="label small" x="20" y="332">no agent still working → ./asha closes the stream, exit 0</text>
</svg>
