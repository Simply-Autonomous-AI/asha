<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="wf-flow-t wf-flow-d">
  <title id="wf-flow-t">From change to commit</title>
  <desc id="wf-flow-d">A change (design, code, tests and docs together) goes to one adversarial review. Each finding is fixed, rebutted with evidence, or declined with a reason. The gate, npm run check, then runs. If it is red, fix the cause and run it again. If it is green, the completing commit records the review trailer, and the push to origin is attempted opportunistically.</desc>
  <defs><marker id="wf-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0e6b66"/></marker></defs>

  <rect class="box" x="10" y="60" width="120" height="80" rx="6"/>
  <text class="label title" x="70" y="88" text-anchor="middle">Change</text>
  <text class="label small" x="70" y="106" text-anchor="middle">design · code</text>
  <text class="label small" x="70" y="122" text-anchor="middle">tests · docs</text>

  <rect class="box accent" x="170" y="60" width="125" height="80" rx="6"/>
  <text class="label title" x="232" y="88" text-anchor="middle">Review</text>
  <text class="label small" x="232" y="106" text-anchor="middle">one round, by a</text>
  <text class="label small" x="232" y="122" text-anchor="middle">non-author</text>

  <rect class="box" x="335" y="60" width="125" height="80" rx="6"/>
  <text class="label title" x="397" y="88" text-anchor="middle">Each finding</text>
  <text class="label small" x="397" y="106" text-anchor="middle">fixed · rebutted</text>
  <text class="label small" x="397" y="122" text-anchor="middle">· declined</text>

  <rect class="box accent" x="500" y="60" width="110" height="80" rx="6"/>
  <text class="label title" x="555" y="88" text-anchor="middle">Gate</text>
  <text class="label mono" x="555" y="110" text-anchor="middle">npm run check</text>

  <rect class="box" x="650" y="60" width="100" height="80" rx="6"/>
  <text class="label title" x="700" y="88" text-anchor="middle">Commit</text>
  <text class="label small" x="700" y="106" text-anchor="middle">Review: trailer</text>
  <text class="label small" x="700" y="122" text-anchor="middle">push to origin</text>

  <path class="edge" d="M130 100 H168" marker-end="url(#wf-arr)"/>
  <path class="edge" d="M295 100 H333" marker-end="url(#wf-arr)"/>
  <path class="edge" d="M460 100 H498" marker-end="url(#wf-arr)"/>
  <path class="edge" d="M610 100 H648" marker-end="url(#wf-arr)"/>
  <text class="label small" x="630" y="92" text-anchor="middle">green</text>

  <path class="edge dim" d="M555 140 V190 H397 V142" marker-end="url(#wf-arr)"/>
  <text class="label small" x="476" y="208" text-anchor="middle">red: fix the root cause, re-run (§8)</text>

  <path class="edge dim" d="M70 60 V30 H700 V58" marker-end="url(#wf-arr)"/>
  <text class="label small" x="385" y="24" text-anchor="middle">checkpoint commits at any time before review (PRINCIPLES §2)</text>

  <text class="label small" x="232" y="165" text-anchor="middle">a fix that is a new design</text>
  <text class="label small" x="232" y="180" text-anchor="middle">gets its own review</text>
</svg>
