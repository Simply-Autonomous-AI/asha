<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="ov-t ov-d">
  <title id="ov-t">asha components and data flow</title>
  <desc id="ov-d">The CLI, and the portal's page in a browser, call the daemon's control API over loopback HTTP. Inside the daemon, the HTTP server hands requests to the channel registry and the agent supervisor. The supervisor loads definitions, stages images, starts containers through the container runtime adapter, downloads and verifies models through the model store, starts llama-server through the model server adapter, and forwards agents' model calls through the model gateway. Agent containers in the colima VM call the agent API with their token. Every daemon failure is written by the log facade to daemon.jsonl.</desc>
  <defs><marker id="ov-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0e6b66"/></marker></defs>
  <rect class="box host" x="5" y="5" width="750" height="460" rx="10"/>
  <text class="label small" x="20" y="455">your machine: the daemon and llama-server bind to 127.0.0.1 only</text>

  <!-- left: clients -->
  <rect class="box" x="20" y="60" width="110" height="56" rx="6"/>
  <text class="label title" x="75" y="84" text-anchor="middle">./asha</text>
  <text class="label small" x="75" y="102" text-anchor="middle">src/cli</text>
  <rect class="box" x="20" y="140" width="110" height="50" rx="6"/>
  <text class="label title" x="75" y="162" text-anchor="middle">Portal</text>
  <text class="label small" x="75" y="179" text-anchor="middle">src/portal</text>

  <!-- daemon -->
  <rect class="box accent" x="175" y="34" width="345" height="400" rx="8"/>
  <text class="label title" x="347" y="54" text-anchor="middle">daemon · src/daemon (wired in compose.ts)</text>
  <rect class="box" x="190" y="64" width="315" height="44" rx="5"/>
  <text class="label title" x="347" y="82" text-anchor="middle">server.ts</text>
  <text class="label small" x="347" y="99" text-anchor="middle">/v1 control · /agent/v1 bearer-token checked · NDJSON</text>

  <rect class="box" x="190" y="130" width="150" height="62" rx="5"/>
  <text class="label title" x="265" y="150" text-anchor="middle">channel/</text>
  <text class="label small" x="265" y="167" text-anchor="middle">Channels · Channel</text>
  <text class="label small" x="265" y="182" text-anchor="middle">handles · deliveries · acks</text>
  <rect class="box" x="355" y="130" width="150" height="62" rx="5"/>
  <text class="label title" x="430" y="150" text-anchor="middle">agents/</text>
  <text class="label small" x="430" y="167" text-anchor="middle">AgentSupervisor</text>
  <text class="label small" x="430" y="182" text-anchor="middle">tokens · lifecycle · calls</text>

  <rect class="box" x="190" y="212" width="150" height="44" rx="5"/>
  <text class="label title" x="265" y="231" text-anchor="middle">definitions/</text>
  <text class="label small" x="265" y="247" text-anchor="middle">recipes · images · catalogue</text>
  <rect class="box" x="355" y="212" width="150" height="44" rx="5"/>
  <text class="label title" x="430" y="231" text-anchor="middle">model-gateway/</text>
  <text class="label small" x="430" y="247" text-anchor="middle">chat · embed → data</text>

  <rect class="box" x="190" y="272" width="150" height="44" rx="5"/>
  <text class="label title" x="265" y="291" text-anchor="middle">images/</text>
  <text class="label small" x="265" y="307" text-anchor="middle">stage context · asha.source</text>
  <rect class="box" x="355" y="272" width="150" height="44" rx="5"/>
  <text class="label title" x="430" y="291" text-anchor="middle">model-server/</text>
  <text class="label small" x="430" y="307" text-anchor="middle">LlamaCppServer</text>

  <rect class="box" x="190" y="332" width="150" height="44" rx="5"/>
  <text class="label title" x="265" y="351" text-anchor="middle">container-runtime/</text>
  <text class="label small" x="265" y="367" text-anchor="middle">ColimaRuntime</text>
  <rect class="box" x="355" y="332" width="150" height="44" rx="5"/>
  <text class="label title" x="430" y="351" text-anchor="middle">model-store/</text>
  <text class="label small" x="430" y="367" text-anchor="middle">HuggingFaceModelStore</text>

  <rect class="box" x="190" y="390" width="315" height="32" rx="5"/>
  <text class="label mono" x="347" y="411" text-anchor="middle">log.ts → logs/daemon.jsonl</text>

  <!-- right: external -->
  <rect class="box" x="545" y="44" width="200" height="130" rx="6"/>
  <text class="label title" x="645" y="62" text-anchor="middle">colima VM</text>
  <rect class="box" x="560" y="72" width="170" height="90" rx="5"/>
  <text class="label title" x="645" y="92" text-anchor="middle">agent container</text>
  <text class="label mono" x="645" y="110" text-anchor="middle">hewo-1</text>
  <text class="label small" x="645" y="128" text-anchor="middle">images/&lt;name&gt; + agent-sdk</text>
  <text class="label small" x="645" y="146" text-anchor="middle">node:22-alpine, no npm deps</text>

  <rect class="box" x="545" y="206" width="200" height="56" rx="6"/>
  <text class="label title" x="645" y="228" text-anchor="middle">llama-server (host)</text>
  <text class="label small" x="645" y="246" text-anchor="middle">Metal · OpenAI-compatible</text>

  <rect class="box" x="545" y="330" width="200" height="44" rx="6"/>
  <text class="label title" x="645" y="349" text-anchor="middle">huggingface.co</text>
  <text class="label small" x="645" y="365" text-anchor="middle">pinned commit + sha256 per file</text>
  <rect class="box" x="545" y="390" width="200" height="40" rx="6"/>
  <text class="label mono" x="645" y="415" text-anchor="middle">models/sha256-&lt;digest&gt;/</text>

  <!-- edges -->
  <path class="edge" d="M130 86 H188" marker-start="url(#ov-a)" marker-end="url(#ov-a)"/>
  <text class="label small" x="152" y="80" text-anchor="middle">/v1</text>
  <path class="edge" d="M130 165 H160 V100 H188" marker-end="url(#ov-a)"/>
  <path class="edge" d="M505 86 H558" marker-start="url(#ov-a)" marker-end="url(#ov-a)"/>
  <path class="edge" d="M265 108 V128" marker-end="url(#ov-a)"/>
  <path class="edge" d="M430 108 V128" marker-end="url(#ov-a)"/>
  <path class="edge" d="M430 192 V210" marker-end="url(#ov-a)"/>
  <path class="edge" d="M505 234 H543" marker-end="url(#ov-a)"/>
  <text class="label small" x="533" y="228" text-anchor="middle">chat</text>
  <path class="edge" d="M505 294 H600 V264" marker-end="url(#ov-a)"/>
  <text class="label small" x="560" y="288" text-anchor="middle">spawns</text>
  <path class="edge" d="M505 354 H543" marker-end="url(#ov-a)"/>
  <text class="label small" x="533" y="348" text-anchor="middle">get</text>
  <path class="edge" d="M505 366 H525 V410 H543" marker-end="url(#ov-a)"/>
  <path class="edge dim" d="M190 354 H165 V20 H645 V42" marker-end="url(#ov-a)"/>
  <text class="label small" x="400" y="16" text-anchor="middle">brew install · colima start · docker build / run --rm</text>
</svg>
