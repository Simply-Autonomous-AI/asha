<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img" aria-labelledby="mc-t mc-d">
  <title id="mc-t">The memory agent's cycle and its four tiers</title>
  <desc id="mc-d">For each delivery the agent identifies the scope from the harness-set user, recalls from the four tiers after waiting for that scope's pending writes, assembles a Memory section and the session window into the model request, decides and acts through the channel layer, and then, without being awaited, remembers the turn: the session tier slides, every turn is embedded into the episodic tier, and the chat model extracts facts into the semantic tier and techniques into the procedural tier. Each tier is one JSON file per scope in the container's /memory directory.</desc>
  <style>
  /* For a viewer showing this diagram on its own: docs/assets/docs.css, by tools/docs/svg-standalone.mts. */
  svg:root { background: #ffffff; font-family: "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  svg:root .box { fill: #ffffff; stroke: #17211d; stroke-width: 1.2; }
  svg:root .box.accent { fill: #e0efec; stroke: #0e6b66; }
  svg:root .box.host { fill: #f1f4f2; stroke: #52605a; stroke-dasharray: 4 3; }
  svg:root .box.planned { fill: #ece8f8; stroke: #5b44b0; stroke-dasharray: 4 3; }
  svg:root .label { fill: #17211d; font-size: 13px; }
  svg:root .label.small { font-size: 11px; fill: #52605a; }
  svg:root .label.mono { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
  svg:root .label.title { font-weight: 600; }
  svg:root .edge { stroke: #0e6b66; stroke-width: 1.5; fill: none; }
  svg:root .edge.dim { stroke: #52605a; stroke-dasharray: 4 3; }
  </style>
  <defs><marker id="mc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0e6b66"/></marker></defs>

  <rect class="box" x="10" y="10" width="230" height="50" rx="6"/>
  <text class="label title" x="125" y="31" text-anchor="middle">1 identify</text>
  <text class="label small" x="125" y="49" text-anchor="middle">scope = (channel, message.user)</text>

  <rect class="box accent" x="10" y="84" width="230" height="58" rx="6"/>
  <text class="label title" x="125" y="105" text-anchor="middle">2 recall (read)</text>
  <text class="label small" x="125" y="123" text-anchor="middle">waits for this scope's pending writes;</text>
  <text class="label small" x="125" y="136" text-anchor="middle">embeds the message as a query</text>

  <rect class="box" x="10" y="166" width="230" height="58" rx="6"/>
  <text class="label title" x="125" y="187" text-anchor="middle">3 assemble</text>
  <text class="label small" x="125" y="205" text-anchor="middle"># Memory in the system prompt;</text>
  <text class="label small" x="125" y="218" text-anchor="middle">session window as chat turns</text>

  <rect class="box" x="10" y="248" width="230" height="58" rx="6"/>
  <text class="label title" x="125" y="269" text-anchor="middle">4 decide / act</text>
  <text class="label small" x="125" y="287" text-anchor="middle">reply · send_message · pass</text>
  <text class="label small" x="125" y="300" text-anchor="middle">(model call via the gateway)</text>

  <rect class="box accent" x="10" y="330" width="230" height="58" rx="6"/>
  <text class="label title" x="125" y="351" text-anchor="middle">5 remember (async write)</text>
  <text class="label small" x="125" y="369" text-anchor="middle">not awaited; queued per scope;</text>
  <text class="label small" x="125" y="382" text-anchor="middle">only replies and hand-offs</text>

  <rect class="box host" x="270" y="74" width="240" height="324" rx="8"/>
  <text class="label small" x="390" y="92" text-anchor="middle">tiers, per scope</text>

  <rect class="box" x="282" y="100" width="216" height="66" rx="5"/>
  <text class="label title" x="390" y="119" text-anchor="middle">session</text>
  <text class="label small" x="390" y="137" text-anchor="middle">last 8 turns, gaps ≤ 30 min</text>
  <text class="label small" x="390" y="154" text-anchor="middle">read: replayed as chat turns</text>

  <rect class="box" x="282" y="174" width="216" height="66" rx="5"/>
  <text class="label title" x="390" y="193" text-anchor="middle">episodic</text>
  <text class="label small" x="390" y="211" text-anchor="middle">write: every turn, embedded</text>
  <text class="label small" x="390" y="228" text-anchor="middle">read: top 4 with cosine ≥ 0.3</text>

  <rect class="box" x="282" y="248" width="216" height="66" rx="5"/>
  <text class="label title" x="390" y="267" text-anchor="middle">semantic</text>
  <text class="label small" x="390" y="285" text-anchor="middle">write: ≤ 3 facts, de-duplicated</text>
  <text class="label small" x="390" y="302" text-anchor="middle">read: top 6 with cosine ≥ 0.3</text>

  <rect class="box" x="282" y="322" width="216" height="66" rx="5"/>
  <text class="label title" x="390" y="341" text-anchor="middle">procedural</text>
  <text class="label small" x="390" y="359" text-anchor="middle">write: ≤ 2 techniques, de-duplicated</text>
  <text class="label small" x="390" y="376" text-anchor="middle">read: top 4 with cosine ≥ 0.3</text>

  <rect class="box" x="10" y="440" width="500" height="66" rx="6"/>
  <text class="label title" x="260" y="462" text-anchor="middle">/memory in the agent's container (nothing mounted)</text>
  <text class="label mono" x="260" y="482" text-anchor="middle">/memory/&lt;sha256("channel/user")[:16]&gt;/&lt;tier&gt;.json</text>
  <text class="label small" x="260" y="498" text-anchor="middle">LRU cache in front; saves queued per file; tmp file + rename</text>

  <path class="edge" d="M125 60 V82" marker-end="url(#mc-a)"/>
  <path class="edge" d="M125 142 V164" marker-end="url(#mc-a)"/>
  <path class="edge" d="M125 224 V246" marker-end="url(#mc-a)"/>
  <path class="edge" d="M125 306 V328" marker-end="url(#mc-a)"/>
  <path class="edge dim" d="M268 113 H242" marker-end="url(#mc-a)"/>
  <text class="label small" x="255" y="107" text-anchor="middle">read</text>
  <path class="edge" d="M240 359 H268" marker-end="url(#mc-a)"/>
  <text class="label small" x="255" y="353" text-anchor="middle">write</text>
  <path class="edge dim" d="M390 398 V438" marker-start="url(#mc-a)" marker-end="url(#mc-a)"/>
  <path class="edge dim" d="M125 388 V414 H4 V113 H8" marker-end="url(#mc-a)"/>
  <text class="label small" x="132" y="410">next recall waits for these writes</text>
</svg>
