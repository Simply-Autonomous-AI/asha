<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -10 760 480" role="img" aria-labelledby="rl-t rl-d">
  <title id="rl-t">How a recipe, an image and catalogue entries combine at launch</title>
  <desc id="rl-d">AgentSupervisor's private launch reads the three definitions in order: the recipe, the image it names, then its chat model entry and, if set, its embedding model entry; then the recipe's documents, from its folder. Each catalogue entry goes to the model store's ensure and then the model server's ensureServing, giving an endpoint. The image directory and the compiled code in dist are staged and digested, and ensureImage builds the tag asha-image-name:digest only when that tag is missing, never replacing a tag. The supervisor keeps an agent record keyed by a new token holding the recipe, the entries and their endpoints, then creates the container asha-channel-recipe-6-hex from that exact tag, with ASHA_URL and ASHA_AGENT_TOKEN, copies the recipe's documents into its /workspace, and starts it. At run time the recipe's description goes into the roster, its prompt and full-text documents reach the agent in its welcome and go into its system prompt, messageTimeoutMs bounds each delivery, startupTimeoutMs bounds coming online, and the recipe's chat block is merged over the entry's on every chat call.</desc>
  <style>
